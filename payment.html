<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft | Secure Payment Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/payment-card.js"></script>
    <script src="script.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-indigo-600 py-6 px-8 text-white">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold">CardCraft</h1>
                    <i data-feather="credit-card" class="w-8 h-8"></i>
                </div>
                <p class="mt-2 opacity-90">Secure payment processing</p>
            </div>

            <!-- Payment Form -->
            <div class="p-8">
                <payment-card></payment-card>
                
                <form id=donationForm class="mt-8 space-y-6">
                    <div>
                        <label for="cardNumber" class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
                        <div class="relative">
                            <input type="text" id="cardNumber" name="cardNumber" maxlength="19" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" 
                                placeholder="1234 5678 9012 3456" required>
                            <div class="absolute right-3 top-3">
                                <div id="cardType" class="w-8 h-6"></div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="expiry" class="block text-sm font-medium text-gray-700 mb-1">Expiry Date</label>
                            <input type="text" id="expiry" name="expiry" maxlength="5" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" 
                                placeholder="MM/YY" required>
                        </div>
                        <div>
                            <label for="cvv" class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                            <div class="relative">
                                <input type="text" id="cvv" name="cvv" maxlength="4" 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" 
                                    placeholder="123" required>
                                <i data-feather="help-circle" class="absolute right-3 top-3.5 text-gray-400 cursor-pointer" 
                                    title="3 or 4 digit security code"></i>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name on Card</label>
                        <input type="text" id="name" name="name" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" 
                            placeholder="John Doe" required>
                    </div>

                    <button type="submit" 
                        class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-indigo-700 transition duration-200 flex items-center justify-center">
                        <span>Pay Now</span>
                        <i data-feather="lock" class="ml-2 w-4 h-4"></i>
                    </button>
                </form>

                <div class="mt-6 flex items-center justify-center space-x-4">
                    <div class="flex items-center">
                        <i data-feather="shield" class="w-5 h-5 text-green-500 mr-2"></i>
                        <span class="text-sm text-gray-600">SSL Secure</span>
                    </div>
                    <div class="flex items-center">
                        <i data-feather="credit-card" class="w-5 h-5 text-green-500 mr-2"></i>
                        <span class="text-sm text-gray-600">PCI Compliant</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        feather.replace();
    </script>
    
    <script>
    // Grab form and inputs
    const paymentForm = document.getElementById('paymentForm');
    const cardNumber = document.getElementById('cardNumber');
    const expiry = document.getElementById('expiry');
    const cvv = document.getElementById('cvv');
    const name = document.getElementById('name');

    // Object to store form data
    let paymentData = {
        cardNumber: '',
        expiry: '',
        cvv: '',
        name: ''
    };

    // Listen to input events
    cardNumber.addEventListener('input', e => paymentData.cardNumber = e.target.value);
    expiry.addEventListener('input', e => paymentData.expiry = e.target.value);
    cvv.addEventListener('input', e => paymentData.cvv = e.target.value);
    name.addEventListener('input', e => paymentData.name = e.target.value);

    // Handle form submission
    paymentForm.addEventListener('submit', e => {
        e.preventDefault();
        console.log('Form submitted:', paymentData);
        // Here you can send to a server or redirect
    });
</script>

</body>
</html>
